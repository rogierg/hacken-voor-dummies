# Azure DevOps Pipeline - Cleanup Production (B1)
# Manual trigger only - deletes B1 production resources to stop billing
# Run this after a workshop to save costs

trigger: none # Manual only

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Set these in Azure DevOps Library or Pipeline Variables
  # azureSubscription: Set as pipeline variable (your Azure service connection name)
  # resourceGroupName: Set as pipeline variable (e.g., rg-hacken-voor-dummies)
  environmentName: 'prod'
  webAppName: 'hacken-voor-dummies'

stages:
- stage: Cleanup
  displayName: 'Delete B1 Production Resources'
  jobs:
  - job: DeleteResources
    displayName: 'Delete App Service Plan and Web App'
    steps:
    - task: AzureCLI@2
      displayName: 'Delete production resources'
      inputs:
        azureSubscription: '$(azureSubscription)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "Deleting production webapp: $(webAppName)"

          # Check if webapp exists
          webappExists=$(az webapp show \
            --name $(webAppName) \
            --resource-group $(resourceGroupName) \
            --query "name" \
            --output tsv 2>/dev/null || echo "")

          if [ -z "$webappExists" ]; then
            echo "##[warning]Webapp $(webAppName) not found. Nothing to delete."
            exit 0
          fi

          # Get the App Service Plan ID before deleting the webapp
          planId=$(az webapp show \
            --name $(webAppName) \
            --resource-group $(resourceGroupName) \
            --query "serverFarmId" \
            --output tsv)

          planName=$(basename $planId)

          echo "Found webapp $(webAppName) using plan: $planName"

          # Delete the webapp first
          echo "Deleting webapp..."
          az webapp delete \
            --name $(webAppName) \
            --resource-group $(resourceGroupName)
          echo "Webapp deleted successfully."

          # Delete the App Service Plan (this stops all B1 charges)
          echo "Deleting App Service Plan: $planName (this stops all B1 charges)..."
          az appservice plan delete \
            --name $planName \
            --resource-group $(resourceGroupName) \
            --yes

          echo "##[section]Production resources deleted successfully!"
          echo "B1 billing has stopped. Staging (F1 free) is still running."
