# Azure DevOps Pipeline - Production (B1 Basic Tier)
# Manual trigger only - creates B1 tier for workshops
# Run this before a workshop, use cleanup pipeline after

trigger: none # Manual only

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Set these in Azure DevOps Library or Pipeline Variables
  # azureSubscription: Set as pipeline variable (your Azure service connection name)
  # resourceGroupName: Set as pipeline variable (e.g., rg-hacken-voor-dummies)
  # allowedIps: (Optional) Set as pipeline variable for school network
  pythonVersion: '3.12'
  environmentName: 'prod'
  skuName: 'B1'
  skuTier: 'Basic'
  webAppName: 'hacken-voor-dummies'

stages:
- stage: Infrastructure
  displayName: 'Deploy B1 Infrastructure'
  jobs:
  - job: DeployInfra
    displayName: 'Deploy Bicep Templates'
    steps:
    - task: AzureCLI@2
      displayName: 'Deploy Bicep infrastructure'
      inputs:
        azureSubscription: '$(azureSubscription)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Build parameters for B1 production
          params="environmentName=$(environmentName) skuName=$(skuName) skuTier=$(skuTier) webAppName=$(webAppName)"

          # Add optional IP allowlist if set
          if [ -n "$(allowedIps)" ]; then
            # Convert comma-separated IPs to JSON array
            ips=$(echo "$(allowedIps)" | sed 's/,/","/g' | sed 's/^/["/' | sed 's/$/"]/')
            params="$params allowedIpAddresses=$ips"
          fi

          # Deploy infrastructure with explicit name
          echo "Deploying B1 production with parameters: $params"
          deployment_name="infra-deployment-prod"

          az deployment group create \
            --resource-group $(resourceGroupName) \
            --name $deployment_name \
            --template-file infra/main.bicep \
            --parameters $params

          # Get the webapp name from deployment outputs
          deployment_output=$(az deployment group show \
            --resource-group $(resourceGroupName) \
            --name $deployment_name \
            --query properties.outputs.webAppName.value \
            --output tsv)

          echo "Deployed webapp name: $deployment_output"

          if [ -z "$deployment_output" ]; then
            echo "##[error]Failed to get webapp name from deployment"
            exit 1
          fi

          echo "##vso[task.setvariable variable=webAppName;isOutput=true]$deployment_output"
      name: infraDeploy

- stage: Build
  displayName: 'Build Application'
  jobs:
  - job: BuildJob
    displayName: 'Build and Package'
    steps:
    - task: UsePythonVersion@0
      displayName: 'Use Python $(pythonVersion)'
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        echo "Cleaning build artifacts..."
        rm -rf output.tar.zst oryx-manifest.toml __pycache__ .python_packages
        echo "Installing dependencies..."
        python -m pip install --upgrade pip
        pip install -r requirements.txt -t .python_packages/lib/site-packages
      displayName: 'Clean and install dependencies'

    - task: ArchiveFiles@2
      displayName: 'Archive application files'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/app-$(Build.BuildId).zip'
        replaceExistingArchive: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/app-$(Build.BuildId).zip'
        ArtifactName: 'drop'

- stage: Deploy
  displayName: 'Deploy to Azure App Service'
  dependsOn:
  - Infrastructure
  - Build
  condition: succeeded()
  variables:
    webAppName: $[ stageDependencies.Infrastructure.DeployInfra.outputs['infraDeploy.webAppName'] ]
  jobs:
  - deployment: DeployWeb
    displayName: 'Deploy Flask App'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to App Service'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appType: 'webAppLinux'
              appName: '$(webAppName)'
              package: '$(Pipeline.Workspace)/drop/app-$(Build.BuildId).zip'
              runtimeStack: 'PYTHON|3.12'
              startUpCommand: 'python main.py'
              appSettings: '-SCM_DO_BUILD_DURING_DEPLOYMENT false -PYTHONPATH /home/site/wwwroot/.python_packages/lib/site-packages'
