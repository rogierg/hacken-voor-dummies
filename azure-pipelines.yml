# Azure DevOps Pipeline for hacken-voor-dummies
# Automatically deploys infrastructure and application to Azure on push to main branch

trigger:
  branches:
    include:
    - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Set these in Azure DevOps Library or Pipeline Variables
  # azureSubscription: Set as pipeline variable (your Azure service connection name)
  # resourceGroupName: Set as pipeline variable (e.g., rg-hacken-voor-dummies)
  pythonVersion: '3.12'
  environmentName: 'prod'

stages:
- stage: Infrastructure
  displayName: 'Deploy Infrastructure'
  jobs:
  - job: DeployInfra
    displayName: 'Deploy Bicep Templates'
    steps:
    - task: AzureCLI@2
      displayName: 'Deploy Bicep infrastructure'
      inputs:
        azureSubscription: '$(azureSubscription)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az deployment group create \
            --resource-group $(resourceGroupName) \
            --template-file infra/main.bicep \
            --parameters environmentName=$(environmentName)

          # Get the App Service name and export for next stages
          appName=$(az webapp list \
            --resource-group $(resourceGroupName) \
            --query "[0].name" \
            --output tsv)

          echo "##vso[task.setvariable variable=webAppName;isOutput=true]$appName"
      name: infraDeploy

- stage: Build
  displayName: 'Build Application'
  jobs:
  - job: BuildJob
    displayName: 'Build and Package'
    steps:
    - task: UsePythonVersion@0
      displayName: 'Use Python $(pythonVersion)'
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        echo "Installing dependencies..."
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: 'Install dependencies'

    - task: ArchiveFiles@2
      displayName: 'Archive application files'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/app-$(Build.BuildId).zip'
        replaceExistingArchive: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/app-$(Build.BuildId).zip'
        ArtifactName: 'drop'

- stage: Deploy
  displayName: 'Deploy to Azure App Service'
  dependsOn:
  - Infrastructure
  - Build
  condition: succeeded()
  variables:
    webAppName: $[ stageDependencies.Infrastructure.DeployInfra.outputs['infraDeploy.webAppName'] ]
  jobs:
  - deployment: DeployWeb
    displayName: 'Deploy Flask App'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to App Service'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appType: 'webAppLinux'
              appName: '$(webAppName)'
              package: '$(Pipeline.Workspace)/drop/app-$(Build.BuildId).zip'
              runtimeStack: 'PYTHON|3.12'
              startUpCommand: 'python main.py'
              appSettings: '-SCM_DO_BUILD_DURING_DEPLOYMENT false'
